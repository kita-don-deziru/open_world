<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Three.js 広大な地形 + Meshy GLB</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #87ceeb; }
    #info {
      position: absolute; top: 10px; left: 10px; color: white;
      background: rgba(0,0,0,0.5); padding: 10px; font-family: sans-serif;
    }
  </style>
  <!-- Three.js をCDNから読み込む設定 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com",
        "three/addons/": "https://unpkg.com"
      }
    }
  </script>
</head>
<body>
  <div id="info">左ドラッグ: 回転 / 右ドラッグ: 移動 / ホイール: ズーム</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. シーン・カメラ・レンダラーの基本設定
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // 空の色
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.0025); // 遠くを霞ませて広大さを演出

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 80);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; // 影を有効化
    document.body.appendChild(renderer.domElement);

    // マウスで視点を操作するコントロール
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // 地面の下に潜らないように制限

    // 2. ライト（太陽光と環境光）
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(50, 100, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 3. 広大な地形（テレイン）の生成
    // 高さを計算する関数（サイン波の組み合わせで簡易的な山と谷を作る）
    function getTerrainHeight(x, z) {
      return Math.sin(x * 0.03) * Math.cos(z * 0.03) * 12 + Math.sin(x * 0.01 + z * 0.01) * 8;
    }

    const terrainSize = 1000; // 1000m x 1000m の広さ
    const segments = 128;     // 分割数（細かいほど滑らかな地形になる）
    const terrainGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, segments, segments);
    terrainGeo.rotateX(-Math.PI / 2); // 地面になるよう水平に倒す

    // 頂点のY座標（高さ）を書き換える
    const pos = terrainGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      pos.setY(i, getTerrainHeight(x, z));
    }
    terrainGeo.computeVertexNormals(); // 光の当たり方を再計算

    const terrainMat = new THREE.MeshStandardMaterial({ color: 0x3b7a57, roughness: 0.9 });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    // 4. Meshy AIのGLBモデルを読み込んで配置する
    const loader = new GLTFLoader();
    
    // ★ここにMeshyからダウンロードしたファイル名を指定（同じフォルダに置く）
    const modelPath = './Trees.gltf'; 

    loader.load(
      modelPath,
      (gltf) => {
        const baseModel = gltf.scene;
        
        // モデルに影の設定を適用
        baseModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        // 読み込んだモデルを複製して50個ランダム配置する
        for (let i = 0; i < 50; i++) {
          const clone = baseModel.clone();
          
          // -200 ～ +200 の範囲にランダム配置
          const x = (Math.random() - 0.5) * 400;
          const z = (Math.random() - 0.5) * 400;
          const y = getTerrainHeight(x, z); // 地形の高さにピッタリ合わせる

          clone.position.set(x, y, z);
          clone.rotation.y = Math.random() * Math.PI * 2; // 向きをランダムに
          
          // サイズ調整（Meshyのモデルが大きい/小さい場合はここを変更）
          const scale = 2.0 + Math.random() * 1.5;
          clone.scale.set(scale, scale, scale);

          scene.add(clone);
        }
      },
      undefined,
      (error) => {
        console.warn('GLBファイルが見つからないため、代わりに赤い箱を表示します:', error);
        // ファイルがない場合の動作確認用ダミーオブジェクト
        const box = new THREE.Mesh(new THREE.BoxGeometry(4, 8, 4), new THREE.MeshStandardMaterial({ color: 0xff4444 }));
        box.position.set(0, getTerrainHeight(0, 0) + 4, 0);
        scene.add(box);
      }
    );

    // 5. 画面リサイズ対応とアニメーションループ
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
